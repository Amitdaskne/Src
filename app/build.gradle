apply plugin: 'com.android.application'

android {
    namespace "com.amit.clipboard"
    compileSdk 34

    defaultConfig {
        applicationId "com.amit.clipboard"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

repositories {
    google()
    mavenCentral()
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
}
